# Issue chooser configuration. Blank issues are disabled so every report arrives with the
# triage fields the templates collect — and so that a security report is never filed as a
# free-form public issue.
blank_issues_enabled: false

contact_links:
  # Absolute URL on purpose. The repo-relative form (`../../security/advisories/new`)
  # was tried first to avoid a hardcoded owner/repo slug, but GitHub rejects it: with the
  # relative URL the repository's rendered `contactLinks` (GraphQL) came back EMPTY, so
  # the chooser silently dropped the security link entirely (verified 2026-08-29).
  # Requires private vulnerability reporting to be enabled in Settings → Security
  # (enabled 2026-08-29).
  - name: Report a security vulnerability (private)
    url: 'https://github.com/IvanBBaev/x-mcp/security/advisories/new'
    about: Never file an exploitable issue publicly. Opens a private GitHub Security Advisory, visible only to you and the maintainer. Scope and expectations are in SECURITY.md.
